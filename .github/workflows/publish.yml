name: Publish @useorgx/sdk

on:
  push:
    tags: ['v*']
    branches: ['release/v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - run: npm install --ignore-scripts --no-save --package-lock=false --no-audit --no-fund typescript@5.8.3
      - run: npm run build
      - run: node --test tests/*.test.mjs
      - run: python3 scripts/registry_preflight.py npm --publish
      - name: Require release ref and package version to agree
        run: node -e 'if (process.env.GITHUB_REF_NAME.replace(/^release\//, "") !== "v" + require("./package.json").version) process.exit(1)'
      - run: npm publish --access public --provenance
