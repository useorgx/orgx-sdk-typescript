name: Verify SDK release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-save --package-lock=false --no-audit --no-fund typescript@5.8.3
      - run: npm run build
      - run: node --test tests/*.test.mjs
      - run: npm pack --ignore-scripts --dry-run
      - run: python3 scripts/registry_preflight.py npm
